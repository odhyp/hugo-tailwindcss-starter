name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.168.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
